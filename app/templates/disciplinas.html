{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block page_content %}
{{ wtf.quick_form(form) }}

<h2>Relação de disciplinas cadastradas</h2>
<table class="table">
    <thead>
        <tr>
            <th>Disciplina</th>
            <th>Semestre</th>
        </tr>
    </thead>
    <tbody>
        {% for disciplina in disciplinas %}
        <tr>
            <td>{{ disciplina.nome }}</td>
            <td>{{ disciplina.semestre }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
